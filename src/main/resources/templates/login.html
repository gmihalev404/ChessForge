<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Login | ChessForge</title>
</head>

<body>

<h1>Log in to ChessForge</h1>

<p th:if="${param.error}">
  Invalid username or password.
</p>

<p th:if="${param.logout}">
  You have been logged out.
</p>

<form th:action="@{/login}"
      method="post">

  <div>
    <label for="username">
      Username
    </label>

    <input id="username"
           name="username"
           type="text"
           required
           autofocus>
  </div>

  <div>
    <label for="password">
      Password
    </label>

    <input id="password"
           name="password"
           type="password"
           required>
  </div>

  <button type="submit">
    Log in
  </button>

</form>

<p>
  Don't have an account?

  <a th:href="@{/register}">
    Register
  </a>
</p>

</body>
</html>
